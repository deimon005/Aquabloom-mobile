name: Android Preview (Expo)
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil EAS
        type: choice
        options:
          - preview
          - android-qa
        default: preview
permissions:
  contents: read
concurrency:
  group: android-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check Expo credentials
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Configure EXPO_TOKEN with access to deimon005/aquabloom-mobile."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Android APK
        env:
          BUILD_PROFILE: ${{ inputs.profile }}
        run: pnpm dlx eas-cli@24.8.0 build --platform android --profile "$BUILD_PROFILE" --non-interactive
